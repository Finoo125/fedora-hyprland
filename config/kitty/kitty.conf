# fedora-hyprland default (created once; yours to edit). Noctalia's kitty template adds the colors
# (include themes/noctalia.conf), so they follow the desktop's scheme and wallpaper. Font, padding and borders match Ghostty's.
font_family JetBrainsMono Nerd Font
font_size 11
window_padding_width 10 12
# Hyprland draws the rounded border in the Noctalia accent color.
hide_window_decorations yes
# Slightly see-through, with Hyprland's blur behind it like Noctalia's panels. 1 for solid.
background_opacity 0.95
cursor_shape block
cursor_trail 3
mouse_hide_wait 3.0
# Tabs only appear with two or more; their colors come from the Noctalia theme.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
confirm_os_window_close 0
enable_audio_bell no
include themes/noctalia.conf
