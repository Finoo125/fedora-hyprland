# Portals for Hyprland. Like Fedora's /usr/share/xdg-desktop-portal/hyprland-portals.conf, plus a Secret portal:
# without it Flatpaks can't keep passwords in the keyring (KDE apps also bring KWallet, so name the one we use).
# File dialogs come from KDE (Dolphin's dialog, in the desktop's colors) instead of GTK's.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=kde
