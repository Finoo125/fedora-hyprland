# Portals for Hyprland. Like Fedora's /usr/share/xdg-desktop-portal/hyprland-portals.conf, plus a Secret portal:
# without it Flatpaks can't keep passwords in the keyring (KDE Connect also brings KWallet, so name the one we use).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
